# -*- python -*-
# vim: set filetype=python:
"""RIOT Buildbot master configuration.

Defines the worker pool, schedulers and builders used to compile RIOT
applications across its supported (board, toolchain) combinations. The
`coordinator` builder computes that job matrix at build time and fans it out
across the `compile` builder, which every worker is attached to.

See README.md in this directory for the current scope and what's still
missing (change source, hardware-in-the-loop tests).
"""
import os
import sys

if os.path.dirname(__file__) not in sys.path:
    sys.path.insert(0, os.path.dirname(__file__))

# On a config reload (SIGHUP), Python would reuse the riot_ci modules loaded
# at startup; drop them so changes to riot_ci/ take effect too.
for module in [m for m in sys.modules if m == "riot_ci" or m.startswith("riot_ci.")]:
    del sys.modules[module]

from buildbot import config
from buildbot.plugins import schedulers, steps, util, worker
from buildbot.process.factory import BuildFactory

from riot_ci.steps import ComputeCompileJobs, TriggerCompileJobs, checkout_steps

c = BuildmasterConfig = {}

c["title"] = "RIOT"
c["titleURL"] = "https://github.com/RIOT-OS/RIOT"
c["buildbotURL"] = os.environ.get("BUILDBOT_URL", "http://localhost:8010/")
c["buildbotNetUsageData"] = None

c["db"] = {"db_url": os.environ.get("BUILDBOT_DB_URL", "sqlite:///state.sqlite")}
c["protocols"] = {"pb": {"port": int(os.environ.get("BUILDBOT_WORKER_PORT", "9989"))}}

RIOT_REPO_URL = os.environ.get("RIOT_REPO_URL", "https://github.com/RIOT-OS/RIOT")

# --- web interface -------------------------------------------------------
# Everyone can read. Anything that changes state (force, stop, rebuild, ...)
# requires logging in as "admin" with BUILDBOT_WWW_ADMIN_PASSWORD; without
# that variable, nobody can log in and the web interface is read-only.
WWW_ADMIN_PASSWORD = os.environ.get("BUILDBOT_WWW_ADMIN_PASSWORD")
c["www"] = {
    "port": int(os.environ.get("BUILDBOT_WWW_PORT", "8010")),
    "plugins": {"waterfall_view": {}, "console_view": {}, "grid_view": {}},
    "authz": util.Authz(
        allowRules=[util.AnyControlEndpointMatcher(role="admins")],
        roleMatchers=[util.RolesFromUsername(roles=["admins"], usernames=["admin"])],
    ),
}
if WWW_ADMIN_PASSWORD:
    c["www"]["auth"] = util.UserPasswordAuth({"admin": WWW_ADMIN_PASSWORD})

# --- workers -----------------------------------------------------------
# BUILDBOT_WORKERS lists the worker machines allowed to connect, as
# space-separated "name:password" or "name:password:max" entries, e.g.
# "worker01:secret pi-02:othersecret:2". A buildbot-worker container
# (riotdocker/buildbot-worker/) runs BUILDBOT_WORKER_COUNT workers named
# "<name>-1", "<name>-2", ...; each entry accepts up to "max" of them
# (default: BUILDBOT_WORKER_MAX_PER_MACHINE), so a machine's operator can
# choose and change the count without touching this config. Workers that
# aren't running show up as disconnected.
#
# A worker runs one build per builder at a time; max_builds=1 additionally
# keeps it from running a coordinator and a compile build at once, so each
# build gets the worker's full JOBS setting (see the "compile" builder).
WORKER_MAX_BUILDS = int(os.environ.get("BUILDBOT_WORKER_MAX_BUILDS", "1"))
WORKER_MAX_PER_MACHINE = os.environ.get("BUILDBOT_WORKER_MAX_PER_MACHINE", "16")
c["workers"] = []
for entry in os.environ.get("BUILDBOT_WORKERS", "").split():
    name, _, rest = entry.partition(":")
    password, _, max_count = rest.rpartition(":")
    if not max_count.isdigit():
        # no max given; a ":" in the password isn't a separator
        password, max_count = rest, WORKER_MAX_PER_MACHINE
    if not (name and password and int(max_count) >= 1):
        config.error(f'BUILDBOT_WORKERS: expected "name:password[:max]", got "{entry}"')
        continue
    c["workers"] += [worker.Worker(f"{name}-{i}", password, max_builds=WORKER_MAX_BUILDS)
                     for i in range(1, int(max_count) + 1)]
WORKER_NAMES = [w.workername for w in c["workers"]]

# --- change sources ------------------------------------------------------
# No change source is configured yet. Builds are started manually through the
# "force" scheduler below.
c["change_source"] = []

# --- schedulers ------------------------------------------------------------
c["schedulers"] = [
    schedulers.ForceScheduler(
        name="force",
        builderNames=["coordinator"],
        codebases=[util.CodebaseParameter(
            "",
            branch=util.StringParameter(name="branch", default="master",
                                        label="base branch"),
            revision=util.FixedParameter(name="revision", default=""),
            repository=util.FixedParameter(name="repository", default=RIOT_REPO_URL),
            project=util.FixedParameter(name="project", default=""),
        )],
        properties=[
            util.IntParameter(
                name="pr_number", default=0,
                label="PR number to merge into the base branch (0 = none)"),
            util.StringParameter(
                name="boards", default="",
                label="BOARDS (space-separated, empty = auto-detect)"),
            util.StringParameter(
                name="apps", default="",
                label="APPS (space-separated, empty = all)"),
            util.BooleanParameter(name="full_build", default=False),
            util.BooleanParameter(name="quick_build", default=False),
        ],
    ),
    schedulers.Triggerable(name="trigger-compile", builderNames=["compile"]),
    schedulers.Triggerable(name="trigger-test", builderNames=["test"]),
]

# --- builders ----------------------------------------------------------
# Every builder starts with checkout_steps(): fresh fetch of the base, plus a
# merge of the PR for PR builds (see riot_ci/steps.py).
#
# "coordinator": checks out RIOT, computes the (appdir, board, toolchain) job
# matrix via riot_ci/jobs.py, and triggers one "compile" build per job. A PR
# that doesn't merge cleanly fails here, before any compile build is started.
coordinator_factory = BuildFactory(checkout_steps(RIOT_REPO_URL))
coordinator_factory.addStep(ComputeCompileJobs())
coordinator_factory.addStep(TriggerCompileJobs(
    name="trigger-compile-jobs",
    schedulerNames=["trigger-compile"],
    waitForFinish=False,
))

# "compile": shared builder every worker is attached to. Each triggered build
# carries its own appdir/board/toolchain properties, so Buildbot hands jobs
# out to whichever worker is free next.
#
# JOBS controls the compiler's parallelism (`make -j`) and is expected to be
# set in the worker container's environment (riotdocker/buildbot-worker sets
# it from BUILDBOT_JOBS, defaulting to 4); it falls back to 4 here too if
# that's somehow unset.
compile_factory = BuildFactory(checkout_steps(RIOT_REPO_URL))
compile_factory.addStep(steps.ShellCommand(
    name="compile",
    command=util.Interpolate(
        "make -C%(prop:appdir)s BOARD=%(prop:board)s TOOLCHAIN=%(prop:toolchain)s "
        "all test-input-hash -j${JOBS:-4}"
    ),
    env={
        "RIOT_CI_BUILD": "1",
        # Workers keep their checkouts at different paths. For ccache hits to
        # carry over between them, paths must be relative to the checkout
        # (CCACHE_BASEDIR) and builds must not embed debug info (-g makes
        # ccache hash the absolute working directory).
        "CCACHE_BASEDIR": util.Interpolate("%(prop:builddir)s/build"),
        "CFLAGS_DBG": "",
    },
))
# native32/native64 run as regular host processes, so their test can run
# right after compiling, on the same worker.
compile_factory.addStep(steps.ShellCommand(
    name="test-native",
    command=util.Interpolate("make -C%(prop:appdir)s BOARD=%(prop:board)s test"),
    doStepIf=lambda step: step.getProperty("board") in ("native32", "native64"),
))

# "test": runs a build's test on real hardware. Not dispatched from anywhere
# yet (trigger-test has no caller) -- hardware test-board assignment still
# needs to be designed. Kept here so that piece can be added without
# reshaping the builder layout.
test_factory = BuildFactory(checkout_steps(RIOT_REPO_URL))
test_factory.addStep(steps.ShellCommand(
    name="test",
    command=util.Interpolate(
        "make -C%(prop:appdir)s BOARD=%(prop:board)s TOOLCHAIN=%(prop:toolchain)s "
        "flash-only termdeps -j2 && "
        "make -C%(prop:appdir)s BOARD=%(prop:board)s TOOLCHAIN=%(prop:toolchain)s test"
    ),
))

# collapseRequests=False: Buildbot's default request collapsing only compares
# sourcestamps (revision/branch/...), not build properties. Every job
# triggered onto "compile"/"test" shares the same revision but differs in
# appdir/board/toolchain, so without this, distinct jobs get silently
# collapsed into one and the others are skipped.
c["builders"] = [
    util.BuilderConfig(name="coordinator", workernames=WORKER_NAMES, factory=coordinator_factory),
    util.BuilderConfig(name="compile", workernames=WORKER_NAMES, factory=compile_factory,
                        collapseRequests=False),
    util.BuilderConfig(name="test", workernames=WORKER_NAMES, factory=test_factory,
                        collapseRequests=False),
]
